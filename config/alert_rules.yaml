alerts:
  - name: ChatLatencyP95Breach
    severity: P1
    condition: p95(latency_ms) over response_sent > 3000 for 5m
    type: symptom-based
    owner: Dashboard, SLO & Alert
    runbook: docs/alerts.md#alert-1
  - name: ChatErrorRateBreach
    severity: P1
    condition: count(request_failed) / count(request_received) * 100 > 2 for 5m
    type: symptom-based
    owner: Incident, Report & Demo
    runbook: docs/alerts.md#alert-2
  - name: ChatQualityDrop
    severity: P2
    condition: mean(quality_score) over response_sent < 0.75 for 15m
    type: symptom-based
    owner: Tracing & Prompt Version
    runbook: docs/alerts.md#alert-3
